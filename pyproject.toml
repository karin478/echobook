[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-reader"
version = "0.1.0"
description = "Local read-along audiobook reader for Chinese-speaking learners of English (EPUB + Kokoro TTS)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "kokoro==0.9.4",
    "misaki[en]",
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-playwright"]

[tool.setuptools]
packages = ["kokoro_reader"]

[tool.pytest.ini_options]
markers = ["e2e", "slow"]
addopts = "-m 'not e2e and not slow'"
filterwarnings = [
    # spaCy (via misaki) triggers torch's own deprecation notice on import; not ours to fix
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]
